<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>춘향이와 몽룡이의 결혼식</title>
  </head>
  <body>
    <!-- 
      사용자: 결혼을 앞둔 예비 신혼부부
      목적: 청첩장을 직접 전달하지 못한 사람들에게 전달할 모바일 청첩장
      핵심 행동: 어디에서 결혼을 하는지에 대한 확인과 축하 메세지를 남길 수 있어야 함.
      정보 순서: 결혼 문구 visual -> 웨딩 사진 갤러리 -> 결혼식 위치 및 주소 -> 축하 메세지 작성
    -->
    <header>
      <h1>춘향이와 몽룡이의 결혼식에 초대합니다.</h1>
      <p>춘향이와 몽룡이가 역경과 고난을 이겨내고 결혼하게 됐습니다.</p>
    </header>
  </body>
</html>
